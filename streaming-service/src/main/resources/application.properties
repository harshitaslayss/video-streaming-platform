spring.application.name=streaming-service
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=streaming-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.netflix.streamingservice.event.VideoEncodedEvent
server.port=8084

#aws configuration
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_BUCKET_NAME}
#presigned url expiry in minutes
aws.s3.presigned-url-expiry=180

management.endpoints.web.exposure.include=health,info
app.public-base-url=http://localhost:8084
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175